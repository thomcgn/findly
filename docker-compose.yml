services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findly}
      POSTGRES_USER: ${POSTGRES_USER:-findly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findly}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-findly}
      DB_USERNAME: ${POSTGRES_USER:-findly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-findly}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ANALYSIS_CREATE_REQUESTS_PER_MINUTE: ${ANALYSIS_CREATE_REQUESTS_PER_MINUTE:-20}
      ANALYSIS_READ_REQUESTS_PER_MINUTE: ${ANALYSIS_READ_REQUESTS_PER_MINUTE:-120}
      ANALYSIS_RATE_LIMIT_MAX_CLIENTS: ${ANALYSIS_RATE_LIMIT_MAX_CLIENTS:-10000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
