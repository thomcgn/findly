spring.application.name=findly
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/findly}
spring.datasource.username=${DB_USERNAME:findly}
spring.datasource.password=${DB_PASSWORD:findly}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.rate-limit.creates-per-minute=${ANALYSIS_CREATE_REQUESTS_PER_MINUTE:20}
app.rate-limit.reads-per-minute=${ANALYSIS_READ_REQUESTS_PER_MINUTE:120}
app.rate-limit.max-clients=${ANALYSIS_RATE_LIMIT_MAX_CLIENTS:10000}
